name: feature push CI

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'update/**'
      - 'refactor/**'
      - 'doc/**'
      - 'test/**'

jobs:
  test-and-pr:
    name: Build, Lint, Typecheck and PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # overrides を pnpm-workspace.yaml に置いているため pnpm 10 が必要（pnpm 9 は packages の無い
          # pnpm-workspace.yaml を受け付けず、そこにある overrides も読まない）。Vercel のビルドも pnpm 10。
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: Prepare PR body from template
        id: summary
        env:
          TARGET_BRANCH: dev
        run: |
          git fetch origin "${TARGET_BRANCH}"

          # PRテンプレートファイルを読み込み
          if [ -f ".github/pull_request_template.md" ]; then
            cat .github/pull_request_template.md > pr-body.md
          else
            echo "# Pull Request" > pr-body.md
            echo "" >> pr-body.md
            echo "## 変更内容の概要" >> pr-body.md
            echo "" >> pr-body.md
          fi

          # コミット履歴を追加セクションとして挿入
          echo "" >> pr-body.md
          echo "---" >> pr-body.md
          echo "" >> pr-body.md
          echo "## 📋 コミット履歴（自動生成）" >> pr-body.md
          echo "" >> pr-body.md

          if git rev-parse --verify "origin/${TARGET_BRANCH}" >/dev/null 2>&1; then
            LOG=$(git log "origin/${TARGET_BRANCH}..HEAD" --pretty=format:'- %s (%h)')
            if [ -z "$LOG" ]; then
              echo "- 変更点を特定できませんでした。" >> pr-body.md
            else
              echo "$LOG" >> pr-body.md
            fi
          else
            echo "- origin/${TARGET_BRANCH} ブランチが取得できませんでした。" >> pr-body.md
          fi

          {
            echo "body<<EOF"
            cat pr-body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update PR to dev
        if: success()
        uses: actions/github-script@v7
        env:
          PR_BODY: ${{ steps.summary.outputs.body }}
        with:
          github-token: ${{ secrets.DEV_PR_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headBranch = context.ref.replace('refs/heads/', '');

            // 開発ブランチのプレフィックス一覧
            const allowedPrefixes = ['feature/', 'fix/', 'update/', 'refactor/', 'doc/', 'test/'];
            const isAllowedBranch = allowedPrefixes.some(prefix => headBranch.startsWith(prefix));

            if (!isAllowedBranch) {
              core.info(`Head branch ${headBranch} is not a development branch, skipping PR creation.`);
              return;
            }

            const body = process.env.PR_BODY || '# Pull Request\n\n## 変更内容の概要\n\n- 変更点情報を生成できませんでした。';
            const title = `[CI] ${headBranch} -> dev 自動PR`;

            const handleForbiddenError = (error) => {
              const message = (error && error.message) || '';
              const status = error && error.status;
              if (status === 403 && message.includes('not permitted to create or approve pull requests')) {
                const instructions = [
                  'GitHub ActionsがPRを作成できません。次のいずれかを実施してください:',
                  '1. リポジトリ設定 > Actions > General > Workflow permissions で "Allow GitHub Actions to create and approve pull requests" を有効化する',
                  '2. repoスコープを付与したPATをリポジトリSecret `DEV_PR_TOKEN` として登録する'
                ].join('\n');
                core.setFailed(instructions);
                return true;
              }
              return false;
            };

            try {
              const { data: existing } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:${headBranch}`,
                base: 'dev',
                per_page: 1
              });

              if (existing.length > 0) {
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: existing[0].number,
                  title,
                  body
                });
                core.setOutput('action', 'updated');
                core.setOutput('pull_number', existing[0].number);
              } else {
                const { data: pr } = await github.rest.pulls.create({
                  owner,
                  repo,
                  head: headBranch,
                  base: 'dev',
                  title,
                  body
                });
                core.setOutput('action', 'created');
                core.setOutput('pull_number', pr.number);
              }
            } catch (error) {
              if (!handleForbiddenError(error)) {
                throw error;
              }
            }
